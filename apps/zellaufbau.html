<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Zellaufbau</title>
<script type="application/json" id="probe-app">
{
  "name": "Zellaufbau",
  "icon": "🔬",
  "beschreibung": "Die Schüler beschriften eine Tierzelle und eine Pflanzenzelle, indem sie Karten mit den Namen der Zellbestandteile an die richtige Stelle ziehen (oder antippen und dann die Stelle antippen). Ein Tipp auf einen beschrifteten Teil zeigt kurz seine Aufgabe.",
  "fach": "Natur und Technik, Biologie",
  "jg": "5-8",
  "version": "1",
  "summary": "Anteil richtig beschrifteter Zellbestandteile (Tierzelle 4, Pflanzenzelle 7)",
  "events": [
    { "name": "zellkern-richtig", "text": "Zellkern richtig beschriftet" },
    { "name": "zellmembran-richtig", "text": "Zellmembran richtig beschriftet" },
    { "name": "zellplasma-richtig", "text": "Zellplasma richtig beschriftet" },
    { "name": "mitochondrium-richtig", "text": "Mitochondrium richtig beschriftet" },
    { "name": "zellwand-richtig", "text": "Zellwand richtig beschriftet (nur Pflanzenzelle)" },
    { "name": "vakuole-richtig", "text": "Vakuole richtig beschriftet (nur Pflanzenzelle)" },
    { "name": "chloroplast-richtig", "text": "Chloroplast richtig beschriftet (nur Pflanzenzelle)" },
    { "name": "tierzelle-fertig", "text": "Tierzelle komplett beschriftet" },
    { "name": "pflanzenzelle-fertig", "text": "Pflanzenzelle komplett beschriftet" }
  ],
  "regeln": "Die App kennt genau diese Zellbestandteile: Zellkern, Zellmembran, Zellplasma, Mitochondrium (Tier- und Pflanzenzelle) sowie Zellwand, Vakuole und Chloroplast (nur Pflanzenzelle).\nOben in der App wechselt man zwischen „Tierzelle“ und „Pflanzenzelle“.\nAuf einen beschrifteten Teil tippen zeigt seine Aufgabe in einem Satz.\nFachbegriffe für Jahrgangsstufe 5–6: Zellkern steuert die Zelle, Zellmembran grenzt ab und regelt den Stoffaustausch, Zellplasma füllt die Zelle aus, Mitochondrien gewinnen Energie, Zellwand gibt Festigkeit, Vakuole speichert Zellsaft, Chloroplasten betreiben Fotosynthese.",
  "lernpfadText": "# Die Zelle – Baustein des Lebens\nUntertitel: Tierzelle und Pflanzenzelle kennenlernen\nArt: Lernpfad\nKopfzeile: Natur und Technik · 5. Jahrgangsstufe\nZiele:\n- Die wichtigsten Bestandteile einer Zelle benennen\n- Ihre Aufgaben in einem Satz erklären\n- Tierzelle und Pflanzenzelle unterscheiden\n\n## Station: Die Tierzelle | Zellkern, Zellplasma, Zellmembran, Mitochondrium\nAlle Lebewesen bestehen aus **Zellen** – du auch, aus vielen Billionen. Unter dem Mikroskop sieht eine Tierzelle ungefähr so aus wie links in der App.\n\n[Merke] Der **Zellkern** steuert die Zelle. Die **Zellmembran** umgibt sie wie eine dünne Haut. Das **Zellplasma** füllt sie aus. In den **Mitochondrien** wird Energie gewonnen.\n\n### App-Aufgabe: Der Chef der Zelle\nZieh links die Karte „Zellkern“ an die richtige Stelle. Du kannst eine Karte auch antippen und dann die Stelle antippen.\nEreignis: zellkern-richtig\nTipp: Der Zellkern ist der große, runde, dunkle Teil.\nXP: 10\n\n### App-Aufgabe: Die ganze Tierzelle\nBeschrifte alle vier Teile der Tierzelle.\nEreignis: tierzelle-fertig\nTipp: Die Zellmembran ist der Rand, das Zellplasma die Füllung dazwischen.\nXP: 20\n\n### Quiz\n? Welcher Teil steuert die Zelle?\n[x] der Zellkern\n[ ] die Zellmembran\n[ ] das Zellplasma\n? Wo wird in der Zelle Energie gewonnen?\n[ ] im Zellkern\n[x] in den Mitochondrien\n[ ] in der Zellmembran\n\n## Station: Die Pflanzenzelle | Zellwand, Vakuole, Chloroplasten\nSchalte links oben auf **Pflanzenzelle**. Sie hat alles, was die Tierzelle hat – und noch drei Teile mehr.\n\n[Merke] Die **Zellwand** gibt der Pflanzenzelle Festigkeit. Die **Vakuole** speichert Zellsaft. In den **Chloroplasten** stellt die Pflanze mit Licht Traubenzucker her (Fotosynthese).\n\n### App-Aufgabe: Grün und kräftig\nZieh die Karte „Chloroplast“ an die richtige Stelle der Pflanzenzelle.\nEreignis: chloroplast-richtig\nTipp: Chloroplasten sind die kleinen grünen Körper.\nXP: 10\n\n### App-Aufgabe: Die ganze Pflanzenzelle\nBeschrifte alle sieben Teile der Pflanzenzelle.\nEreignis: pflanzenzelle-fertig\nTipp: Die Zellwand ist der dicke äußere Rand, die Zellmembran liegt direkt innen daran.\nXP: 20\n\n### Zuordnen: Wer macht was?\nZellwand -> gibt Festigkeit\nVakuole -> speichert Zellsaft\nChloroplast -> stellt mit Licht Traubenzucker her\nMitochondrium -> gewinnt Energie\n\n## Station: Vergleich | Was haben beide gemeinsam?\n### Sortieren: In welchen Zellen kommt der Teil vor?\nnur in der Pflanzenzelle: Zellwand, Vakuole, Chloroplast\nin Tier- und Pflanzenzelle: Zellkern, Zellmembran, Zellplasma, Mitochondrium\n\n### Lückentext: Zusammenfassung\nTier- und Pflanzenzellen haben einen [[Zellkern]], eine [[Zellmembran]] und [[Zellplasma]]. Nur Pflanzenzellen haben eine [[Zellwand]], eine große [[Vakuole]] und [[Chloroplasten]].\nWortbank: ja\nExtra: Knochen, Muskel\n"
}
</script>
<style>
  :root { --ink: #1f2a37; --muted: #64748b; --ok: #1f9d55; --bad: #d64545; --card: #fff; --line: #d9e0ea; --acc: #3157f5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; color: var(--ink); background: #f4f7fb; }
  body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 6px 0 0; }
  .seg { display: inline-flex; background: #e4e9f2; border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; font: 600 14px inherit; font-family: inherit; color: var(--ink); min-height: 38px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 3px #0002; }
  .sp { flex: 1; }
  .reset { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 12px; font: 600 13px inherit; font-family: inherit; color: var(--muted); min-height: 38px; cursor: pointer; }
  .prog { font-size: 13px; color: var(--muted); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 10px 10px; gap: 8px; }
  .stage { flex: 1; min-height: 200px; position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .target { cursor: pointer; }
  .target circle.dot { fill: #fff; stroke: var(--acc); stroke-width: 3; }
  .target text { font: 700 15px -apple-system, system-ui, sans-serif; fill: var(--acc); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .target.hot circle.dot { fill: #e8eeff; stroke-width: 5; }
  .target.done circle.dot { fill: var(--ok); stroke: var(--ok); }
  .target.done text.q { fill: #fff; }
  .lbl { font: 700 13px -apple-system, system-ui, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 4px; fill: var(--ink); pointer-events: none; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .card { border: 2px solid var(--acc); color: var(--acc); background: #fff; border-radius: 12px; padding: 9px 14px; font-weight: 700; min-height: 44px; display: inline-flex; align-items: center; cursor: grab; touch-action: none; }
  .card.sel { background: var(--acc); color: #fff; }
  .card.used { display: none; }
  .ghost { position: fixed; pointer-events: none; z-index: 10; opacity: .9; transform: translate(-50%, -50%); box-shadow: 0 6px 20px #0003; }
  .msg { min-height: 22px; font-size: 14px; color: var(--muted); }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .ro .card, .ro .target { cursor: default; }
  .done-all { font-weight: 700; color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>🔬 Zellaufbau</h1>
  <span class="seg" role="tablist"><button data-mode="tier" aria-pressed="true">Tierzelle</button><button data-mode="pflanze" aria-pressed="false">Pflanzenzelle</button></span>
  <span class="sp"></span><span class="prog" id="prog"></span><button class="reset" id="reset">↺ Neu beginnen</button>
</header>
<main>
  <div class="stage" id="stage"></div>
  <div class="msg" id="msg">Zieh eine Karte an die richtige Stelle – oder tippe erst die Karte und dann die Stelle an.</div>
  <div class="cards" id="cards"></div>
</main>
<script>
(function () {
  // Zellbestandteile: Name, Aufgabe (ein Satz), Ereignis
  var PARTS = {
    zellkern: ['Zellkern', 'Der Zellkern steuert die Zelle und enthält die Erbinformation.'],
    zellmembran: ['Zellmembran', 'Die Zellmembran grenzt die Zelle ab und regelt, was hinein- und hinausgeht.'],
    zellplasma: ['Zellplasma', 'Das Zellplasma füllt die Zelle aus; darin liegen die anderen Bestandteile.'],
    mitochondrium: ['Mitochondrium', 'In den Mitochondrien wird Energie für die Zelle gewonnen.'],
    zellwand: ['Zellwand', 'Die Zellwand gibt der Pflanzenzelle Form und Festigkeit.'],
    vakuole: ['Vakuole', 'Die Vakuole speichert Zellsaft und hält die Zelle prall.'],
    chloroplast: ['Chloroplast', 'In den Chloroplasten stellt die Pflanze mit Licht Traubenzucker her (Fotosynthese).']
  };
  // Zielpunkte je Zelle (Koordinaten im SVG 400 × 300) und Lage der Beschriftung
  var CELLS = {
    tier: { parts: ['zellmembran', 'zellplasma', 'zellkern', 'mitochondrium'],
      targets: { zellkern: [170, 140], zellmembran: [338, 118], zellplasma: [250, 205], mitochondrium: [82, 250, 118, 210] } },
    pflanze: { parts: ['zellwand', 'zellmembran', 'zellplasma', 'zellkern', 'vakuole', 'chloroplast', 'mitochondrium'],
      targets: { zellwand: [372, 60], zellmembran: [356, 248], zellplasma: [205, 246], zellkern: [112, 92], vakuole: [228, 150], chloroplast: [262, 262, 300, 228], mitochondrium: [258, 60, 312, 78] } }
  };
  var S = { mode: 'tier', placed: { tier: {}, pflanze: {} }, fertig: { tier: false, pflanze: false } };
  var readonly = false, loaded = false, sel = null;
  var $ = function (s) { return document.querySelector(s); };
  var post = function (m) { m.type = 'probe-app'; try { parent.postMessage(m, '*'); } catch (e) { } };

  function svgTier() {
    return '<ellipse cx="200" cy="150" rx="150" ry="112" fill="#fde7ee" stroke="#c2577a" stroke-width="4"/>'
      + '<circle cx="170" cy="140" r="42" fill="#b79be6" stroke="#6b46c1" stroke-width="3"/><circle cx="160" cy="132" r="11" fill="#6b46c1" opacity=".6"/>'
      + mito(118, 210, -20) + mito(268, 108, 25) + mito(232, 232, 5)
      + '<g fill="#c2577a" opacity=".35"><circle cx="250" cy="170" r="3"/><circle cx="300" cy="150" r="3"/><circle cx="110" cy="160" r="3"/><circle cx="200" cy="230" r="3"/><circle cx="280" cy="200" r="3"/></g>';
  }
  function svgPflanze() {
    return '<rect x="30" y="28" width="340" height="244" rx="10" fill="#e9f6df" stroke="#3f7d20" stroke-width="12"/>'
      + '<rect x="42" y="40" width="316" height="220" rx="6" fill="none" stroke="#7fb35a" stroke-width="3"/>'
      + '<rect x="150" y="80" width="160" height="140" rx="40" fill="#cfe8fb" stroke="#5a9bd5" stroke-width="3"/>'
      + '<circle cx="112" cy="92" r="30" fill="#b79be6" stroke="#6b46c1" stroke-width="3"/><circle cx="105" cy="86" r="8" fill="#6b46c1" opacity=".6"/>'
      + chl(300, 228, 10) + chl(80, 150, -30) + chl(330, 160, 70) + chl(120, 236, 15)
      + mito(312, 78, 20) + mito(70, 210, -10);
  }
  function mito(x, y, r) { return '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ')"><ellipse rx="22" ry="11" fill="#ffd8a8" stroke="#d9480f" stroke-width="2.5"/><path d="M-14 0 q4 -8 8 0 t8 0 t8 0" fill="none" stroke="#d9480f" stroke-width="2"/></g>'; }
  function chl(x, y, r) { return '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ')"><ellipse rx="18" ry="10" fill="#51a33b" stroke="#2b6a1c" stroke-width="2"/><path d="M-10 -3 h20 M-10 3 h20" stroke="#2b6a1c" stroke-width="1.5"/></g>'; }

  function draw() {
    var C = CELLS[S.mode], P = S.placed[S.mode];
    document.body.classList.toggle('ro', readonly);
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)); });
    var g = '<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">' + (S.mode === 'tier' ? svgTier() : svgPflanze());
    var n = 0;
    C.parts.forEach(function (k) { var t = C.targets[k]; if (t.length > 2) g += '<line x1="' + t[2] + '" y1="' + t[3] + '" x2="' + t[0] + '" y2="' + t[1] + '" stroke="#3157f5" stroke-width="2" stroke-dasharray="4 3"/><circle cx="' + t[2] + '" cy="' + t[3] + '" r="3" fill="#3157f5"/>'; });
    C.parts.forEach(function (k) {
      var t = C.targets[k], done = !!P[k]; n++;
      g += '<g class="target' + (done ? ' done' : '') + '" data-target="' + k + '"><circle class="dot" cx="' + t[0] + '" cy="' + t[1] + '" r="15"/>'
        + '<text class="q" x="' + t[0] + '" y="' + t[1] + '">' + (done ? '✓' : n) + '</text>'
        + (done ? '<text class="lbl" x="' + t[0] + '" y="' + (t[1] + 28) + '" text-anchor="middle">' + PARTS[k][0] + '</text>' : '') + '</g>';
    });
    $('#stage').innerHTML = g + '</svg>';
    var left = C.parts.filter(function (k) { return !P[k]; });
    $('#cards').innerHTML = left.length ? left.slice().sort().map(function (k) { return '<span class="card' + (sel === k ? ' sel' : '') + '" data-card="' + k + '">' + PARTS[k][0] + '</span>'; }).join('')
      : '<span class="done-all">✓ Alle Teile der ' + (S.mode === 'tier' ? 'Tierzelle' : 'Pflanzenzelle') + ' sind beschriftet. Tippe auf einen Teil, um seine Aufgabe zu sehen.</span>';
    var total = CELLS.tier.parts.length + CELLS.pflanze.parts.length, ok = Object.keys(S.placed.tier).length + Object.keys(S.placed.pflanze).length;
    $('#prog').textContent = ok + ' von ' + total + ' Teilen';
  }
  function summary() {
    var total = CELLS.tier.parts.length + CELLS.pflanze.parts.length, ok = Object.keys(S.placed.tier).length + Object.keys(S.placed.pflanze).length;
    return { pct: Math.round(ok / total * 100), text: ok + ' von ' + total + ' Teilen beschriftet' };
  }
  function save() { post({ action: 'state', state: S, summary: summary() }); }
  function say(t, cls) { var m = $('#msg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }

  function place(card, target) {
    if (readonly) return;
    var C = CELLS[S.mode];
    if (card === target) {
      S.placed[S.mode][card] = true; sel = null;
      say('✓ Richtig: ' + PARTS[card][0] + '. ' + PARTS[card][1], 'ok');
      post({ action: 'event', name: card + '-richtig' });
      if (C.parts.every(function (k) { return S.placed[S.mode][k]; }) && !S.fertig[S.mode]) {
        S.fertig[S.mode] = true; post({ action: 'event', name: S.mode === 'tier' ? 'tierzelle-fertig' : 'pflanzenzelle-fertig' });
      }
      draw(); save();
    } else {
      say('Nicht ganz – „' + PARTS[card][0] + '“ gehört woanders hin. Versuch es noch einmal.', 'bad');
      var el = document.querySelector('[data-target="' + target + '"]'); if (el) { el.classList.add('shake'); setTimeout(function () { el.classList.remove('shake'); }, 400); }
    }
  }
  // Ziehen mit dem Finger (Pointer-Events) oder antippen
  var drag = null;
  document.addEventListener('pointerdown', function (e) {
    var c = e.target.closest('[data-card]'); if (!c || readonly) return;
    drag = { k: c.dataset.card, x: e.clientX, y: e.clientY, ghost: null, moved: false, id: e.pointerId };
    try { c.setPointerCapture(e.pointerId); } catch (x) { }
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    if (!drag.moved) { drag.moved = true; var g = document.createElement('span'); g.className = 'card sel ghost'; g.textContent = PARTS[drag.k][0]; document.body.appendChild(g); drag.ghost = g; }
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    document.querySelectorAll('.target.hot').forEach(function (t) { t.classList.remove('hot'); });
    var t = hit(e.clientX, e.clientY); if (t) t.classList.add('hot');
  });
  document.addEventListener('pointerup', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    document.querySelectorAll('.target.hot').forEach(function (t) { t.classList.remove('hot'); });
    if (d.ghost) { d.ghost.remove(); var t = hit(e.clientX, e.clientY); if (t) place(d.k, t.dataset.target); return; }
    sel = sel === d.k ? null : d.k; draw();
    if (sel) say('Tippe jetzt in der Zelle die Stelle an, an die „' + PARTS[sel][0] + '“ gehört.');
  });
  document.addEventListener('pointercancel', function () { if (drag && drag.ghost) drag.ghost.remove(); drag = null; });
  function hit(x, y) { var el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('[data-target]') : null; }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-target]');
    if (t) {
      var k = t.dataset.target;
      if (S.placed[S.mode][k]) { say(PARTS[k][0] + ': ' + PARTS[k][1], 'ok'); return; }
      if (sel && !readonly) { place(sel, k); return; }
      say(readonly ? 'Nur ansehen.' : 'Wähle zuerst unten eine Karte.');
      return;
    }
    var m = e.target.closest('[data-mode]'); if (m) { S.mode = m.dataset.mode; sel = null; draw(); if (!readonly) save(); say(S.mode === 'tier' ? 'Tierzelle: vier Teile zum Beschriften.' : 'Pflanzenzelle: sieben Teile zum Beschriften.'); return; }
    if (e.target.closest('#reset') && !readonly) { S = { mode: S.mode, placed: { tier: {}, pflanze: {} }, fertig: { tier: false, pflanze: false } }; sel = null; draw(); save(); say('Neu begonnen.'); }
  });

  // Protokoll mit dem Player
  addEventListener('message', function (e) {
    var m = e.data; if (!m || m.type !== 'probe-app') return;
    if (m.action === 'load') {
      loaded = true; readonly = !!m.readonly;
      if (m.state && m.state.placed) { S = { mode: m.state.mode === 'pflanze' ? 'pflanze' : 'tier', placed: { tier: m.state.placed.tier || {}, pflanze: m.state.placed.pflanze || {} }, fertig: m.state.fertig || { tier: false, pflanze: false } }; }
      sel = null; draw();
    }
    if (m.action === 'flush') post({ action: 'state', state: S, summary: summary(), req: m.req });
  });
  draw();
  post({ action: 'ready', v: 1 });
  var iv = setInterval(function () { if (loaded) clearInterval(iv); else post({ action: 'ready', v: 1 }); }, 1000);
})();
</script>
</body></html>
