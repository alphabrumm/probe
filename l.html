<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PathFinder Player</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PathFinder">
<link rel="icon" href="app/pf-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app/pf-icon-180.png">
<link rel="stylesheet" href="vendor/pathfinder/core/pathfinder.css">
<link rel="stylesheet" href="app/student.css">
<style>
  .u-home { max-width: 640px; margin: 0 auto; padding: 18px 16px 40px; }
  .u-home h1 { display: flex; align-items: center; gap: 10px; font-size: 24px; margin: 6px 0 4px; } .u-home h1 img { width: 34px; height: 34px; }
  .u-cl { background: #fff; border-radius: 16px; padding: 14px 16px; margin: 14px 0; box-shadow: 0 1px 4px #0001; }
  .u-cl h2 { margin: 0 0 2px; font-size: 18px; } .u-cl .help { color: #667; font-size: 14px; }
  .u-un { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid #d6dbe8; background: #f6f8fd; border-radius: 12px; padding: 12px 14px; margin-top: 10px; font: inherit; font-size: 16px; cursor: pointer; color: inherit; }
  .u-un b { flex: 1; } .u-un .ok { color: #2f9e5b; font-size: 14px; }
  .u-hint { background: #fff7d6; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin: 12px 0; }
  .u-err { color: #b3261e; }
  .u-join label { display: block; font-size: 14px; color: #556; margin-top: 12px; }
  .u-join input { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 18px; padding: 10px 12px; border: 1px solid #cfd5e3; border-radius: 10px; margin-top: 4px; background: #fff; color: #111; }
  .u-join #jPin { font-size: 26px; letter-spacing: .2em; max-width: 180px; }
  .u-home .btn { min-height: 48px; padding: 0 20px; border-radius: 12px; border: 0; background: #2b46b5; color: #fff; font: 700 17px system-ui, sans-serif; cursor: pointer; } .u-home .btn.alt { background: #eef0f7; color: #18203a; } .u-home .btn:disabled { opacity: .5; }
  .u-join .btn { margin-top: 14px; }
  /* flache Kopfleisten: mehr Arbeitsfläche für die Schüler */
  .sbar { min-height: 26px; padding: 2px max(8px, env(safe-area-inset-right)) 2px max(8px, env(safe-area-inset-left)); padding-top: max(2px, env(safe-area-inset-top)); font-size: 13px; gap: 6px; }
  .sbar button { min-height: 22px; min-width: 28px; padding: 0 8px; border-radius: 7px; font-size: 12.5px; }
  .sbar .sb-save { font-size: 11.5px; }
  .pfapp-bar .u-watch { font-size: 11.5px; font-weight: 600; color: #8a5a00; background: #fff3cd; border-radius: 6px; padding: 1px 6px; white-space: nowrap; animation: uw 2s ease-in-out infinite; }
  @keyframes uw { 50% { opacity: .55; } }
  .pfapp-bar .u-jb { display: inline-flex; gap: 6px; }
  .u-ended { background: transparent !important; } .u-ended .help { font-size: 12px; color: #667; }
  .u-old summary { cursor: pointer; color: #556; font-size: 14px; margin-top: 12px; }
  .u-endbox { position: absolute; inset: 0; z-index: 5; background: #0007; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .u-endin { background: #fff; color: #18203a; border-radius: 16px; padding: 18px 20px; max-width: 520px; box-shadow: 0 10px 40px #0005; font: 15px/1.45 system-ui, sans-serif; }
  .u-endin h2 { margin: 0 0 8px; font-size: 19px; }
  .u-endbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .u-endbtns button { font: 600 15px system-ui, sans-serif; border: 1px solid #cfd5e3; background: #f4f6fb; color: #18203a; border-radius: 10px; padding: 9px 14px; cursor: pointer; }
  .u-endbtns button[data-e="view"] { background: #2b46b5; color: #fff; border-color: #2b46b5; }
  @media (prefers-color-scheme: dark) { .u-endin { background: #1d2233; color: #eef; } .u-endbtns button { background: #242a3d; color: #eef; border-color: #343c55; } }
  /* Kacheln je Klasse, Klassenansicht */
  .u-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 14px; }
  .u-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; min-height: 116px; border: 0; border-radius: 16px; padding: 14px 16px; background: #fff; box-shadow: 0 1px 4px #0001; font: inherit; color: inherit; cursor: pointer; border-top: 6px solid #2b46b5; }
  .u-tile:nth-child(6n+2) { border-top-color: #2f9e5b; } .u-tile:nth-child(6n+3) { border-top-color: #c2410c; } .u-tile:nth-child(6n+4) { border-top-color: #7c3aed; } .u-tile:nth-child(6n+5) { border-top-color: #0e7490; } .u-tile:nth-child(6n) { border-top-color: #be185d; }
  .u-tile .u-tk { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #667; } .u-tile b { font-size: 19px; } .u-tile .help { color: #667; font-size: 13px; }
  .u-dots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; font-size: 13px; }
  .u-back { border: 0; background: none; color: #2b46b5; font: 600 16px system-ui, sans-serif; padding: 6px 0; cursor: pointer; }
  .u-st { width: 1.4em; text-align: center; } .u-ic { opacity: .8; }
  .u-legend { color: #667; font-size: 12.5px; margin-top: 18px; }
  .u-apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
  .u-app { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid #d6dbe8; background: #f6f8fd; border-radius: 14px; padding: 12px 8px; font: inherit; color: inherit; cursor: pointer; }
  .u-app .u-ai { font-size: 30px; } .u-app .help { font-size: 12px; color: #667; }
  .u-pr { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: center; }
  .u-pr .u-un { flex-wrap: wrap; } .u-pr .u-un .help { flex-basis: 100%; padding-left: calc(1.4em + 10px); font-size: 12.5px; color: #667; }
  .u-pb { display: flex; gap: 6px; margin-top: 10px; } .u-pb button { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid #d6dbe8; background: #fff; font-size: 18px; cursor: pointer; } .u-pb button:disabled { opacity: .4; }
  .u-cm { grid-column: 1 / -1; font-size: 14px; background: #eef7f0; border-radius: 10px; padding: 6px 10px; margin-top: 6px; }
  .u-un:disabled { opacity: .5; }
  /* Lernpfad + App: links die App, rechts der Lernpfad */
  body.pf-player > .app.u-split { display: flex; } .app.u-split > .u-papp { flex: 55 1 0; min-width: 0; background: #fff; border-right: 1px solid #d6dbe8; }
  .app.u-split > .lpwrap { flex: 45 1 0; min-width: 0; } .app.u-split.u-only > .lpwrap { display: none; } .app.u-split.u-only > .u-papp { border: 0; }
  @media (max-width: 760px) { body.pf-player > .app.u-split { flex-direction: column; } .app.u-split > .u-papp { border-right: 0; border-bottom: 1px solid #d6dbe8; } }
  .sb-st { font-size: 11.5px; white-space: nowrap; } .sb-x { display: inline-flex; gap: 6px; }
  .u-end { background: #fde8e7; color: #7a1b14; padding: 3px 12px; font-size: 12.5px; text-align: center; }
  @media (prefers-color-scheme: dark) { .u-tile { background: #1d2233; } .u-app, .u-pb button { background: #242a3d; border-color: #343c55; color: #eef; } .u-cm { background: #1f3326; } .u-back { color: #9db0ff; }
    .u-cl { background: #1d2233; } .u-un { background: #242a3d; border-color: #343c55; } .u-hint { background: #3a3420; } }
</style>
</head>
<body class="pf-player">
<div class="sbar" id="sbar" hidden>
  <button id="sbBack" title="Zur Übersicht">‹<span class="t"> Übersicht</span></button>
  <span class="sb-st" id="sbSt"></span><span class="sb-t" id="sbT"></span>
  <span class="sb-sp"></span>
  <span class="sb-save" id="sbSave"></span><span class="sb-x" id="sbX"></span>
  <button id="sbSub" title="Bearbeitung an die Lehrkraft abgeben">✓<span class="t"> Abgeben</span></button>
</div>
<div id="uEnd" class="u-end" hidden></div>
<div class="app" id="app" hidden><section class="lpwrap"><div class="lp-scroll" id="scroll"><div class="lp" id="lp"></div></div></section></div>
<div class="u-home" id="home"><p>lädt …</p></div>
<script type="module" src="app/unterricht-s.js"></script>
</body></html>
