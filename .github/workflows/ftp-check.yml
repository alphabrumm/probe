name: FTP-Ordner prüfen (nur lesen)
# Zeigt, was im Probe-Ordner auf dem Webspace liegt, und ob sich der Ordner lib/ anlegen lässt.
# Ändert nichts außer: legt lib/ an, falls es fehlt. Daten (data/) werden nicht gelesen.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Ordner ansehen
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_DIR }}
          PROTO: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        run: |
          HOST="${S#ftp://}"; HOST="${HOST#ftps://}"; HOST="${HOST%/}"
          if [ "$PROTO" = "ftp" ]; then SSL="set ftp:ssl-allow false;"; else SSL="set ftp:ssl-force true; set ftp:ssl-protect-data true;"; fi
          lftp -u "$U","$P" "$HOST" <<EOT || true
          set cmd:fail-exit false
          set net:timeout 30
          set net:max-retries 2
          set ftp:passive-mode true
          $SSL
          debug 0
          cd "$D"
          echo "== Startordner (pwd):"
          pwd
          echo "== Inhalt:"
          cls -la
          echo "== lib/:"
          cls -la lib/
          echo "== app/ (Anzahl Einträge):"
          cls -1 app/ | wc -l
          echo "== lib anlegen:"
          mkdir -f lib
          cls -la lib/
          bye
          EOT
