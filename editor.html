<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Probe · Prüfung bearbeiten</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="vendor/pathfinder/core/pathfinder.css">
<style>
  /* „Fertig – zurück zu Probe“: zart grün und leicht pulsierend, damit man ihn findet */
  html:not(.pf-ro) #bDone { background: #dcf3e4; border-color: #8fd1a8; color: #1d6b3d; animation: probe-puls 2.4s ease-in-out infinite; }
  html:not(.pf-ro) #bDone:hover { background: #c9ecd6; }
  @keyframes probe-puls { 0%, 100% { box-shadow: 0 0 0 0 rgba(47, 160, 95, .45); } 50% { box-shadow: 0 0 0 7px rgba(47, 160, 95, 0); } }
  @media (prefers-color-scheme: dark) { html:not(.pf-ro) #bDone { background: #1d3a2a; border-color: #3f8a5f; color: #b9f0cd; } html:not(.pf-ro) #bDone:hover { background: #24493a; } }
  @media (prefers-reduced-motion: reduce) { #bDone { animation: none; } }
</style>
</head>
<body>
<!-- PathFinder, eingebettet in Probe: wird von der Probe-Seite gestartet (window.probeEdit) -->
<div class="app" id="app">
  <section class="lpwrap" aria-label="Prüfung">
    <div class="ed-bar" id="edBar">
      <span class="pf-brand"><img src="app/icon.svg" alt="" title="Probe"></span>
      <button class="ed-btn ed-ki" id="bKI" title="KI-Tools"><svg class="ki-ico" viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-hidden="true"><path fill="currentColor" d="M10 2.5l1.7 5.3a3 3 0 0 0 1.9 1.9l5.3 1.7-5.3 1.7a3 3 0 0 0-1.9 1.9L10 20.3l-1.7-5.3a3 3 0 0 0-1.9-1.9L1.1 11.4l5.3-1.7a3 3 0 0 0 1.9-1.9zM19 2l.8 2.2L22 5l-2.2.8L19 8l-.8-2.2L16 5l2.2-.8z"/></svg><span class="t"> KI-Tools</span></button>
      <span class="ed-sep"></span>
      <span class="ed-seg" id="modeSeg"><button data-mode="edit" aria-pressed="true">✎ Bearbeiten</button><button data-mode="preview">▶ Vorschau</button></span>
      <span class="ed-seg" id="viewSeg" title="Alle Stationen untereinander zeigen oder nur die aktuelle"><button data-view="all" aria-pressed="true">Alle<span class="t"> Teile</span></button><button data-view="one" aria-pressed="false">Ein<span class="t">en Teil</span></button></span>
      <button class="ed-btn ed-lbl" id="bDesign" title="Einstellungen: Aussehen, Kopf">⚙<span class="t"> Einstellungen</span></button>
      <span class="ed-sep"></span>
      <button class="ed-btn" id="bUndo" title="Rückgängig (⌘Z)" aria-label="Rückgängig">↶</button>
      <button class="ed-btn" id="bRedo" title="Wiederholen (⇧⌘Z)" aria-label="Wiederholen">↷</button>
      <span class="sp"></span>
      <span class="ed-saved" id="saved"></span>
      <button class="ed-btn" id="bOpen" title="Dokumente">📂<span class="t"> Dokumente</span></button>
      <button class="ed-btn" id="bMore" title="Mehr">⋯</button>
    </div>
    <div class="lp-scroll" id="scroll"><div class="lp" id="lp"></div></div>
  </section>
</div>
<script type="module">
import { startPathFinder } from './vendor/pathfinder/core/pathfinder.js';
import { jpadPlugin } from './vendor/pathfinder/core/pfjpad.js'; // „Programmier-Aufgabe“ für die JPad-Lernumgebung (Modul Unterricht)
// Vorgaben aus Probe (URL): Fach, Klasse → Jahrgangsstufe, Bearbeitungszeit → Umfang, Kopfzeile – für den KI-Dialog
const q = new URLSearchParams(location.search), SV = q.get('form') === 'befragung', ki = { art: SV ? 'befragung' : 'pruefung' }; // Umfragen: Befragung statt Prüfung
if (SV) document.title = 'Probe · Fragebogen gestalten';
if (q.get('fach')) ki.fach = q.get('fach');
const jg = q.get('jg') || (q.get('klasse') || '').match(/\d{1,2}/)?.[0]; if (jg) ki.jg = +jg;
if (+q.get('min') > 0 && !SV) ki.min = +q.get('min');
if (q.get('kopf')) ki.kopf = q.get('kopf');
// Adressen der Apps (JPad …) für Programmier-Aufgaben – kommen nachträglich, das Objekt wird erst beim Öffnen gelesen
const apps = {}; fetch('api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"a":"cfg"}' }).then(r => r.json()).then(j => Object.assign(apps, j.apps || {})).catch(() => { });
window.probeEdit = opts => startPathFinder({ appName: 'Probe', logo: 'app/icon.svg', storage: 'probe', forms: [SV ? 'befragung' : 'pruefung'], lernpfadStorage: 'pathfinder', examFromLernpfad: false, ki, apps, ...opts, ...(opts.jpad ? { plugins: [jpadPlugin] } : {}) });
window.dispatchEvent(new Event('probe-editor-ready'));
parent.postMessage({ probeEditor: 'ready' }, location.origin);
</script>
</body></html>
